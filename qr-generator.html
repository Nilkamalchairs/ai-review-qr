<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">  <title>Google Review QR Code Generator</title>
  <meta name="description" content="Create a Google Review QR Code for your business.">  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f6f8fb;
      color: #202124;
    }

    .header {
      text-align: center;
      padding: 45px 20px 25px;
    }

    .logo {
      width: 58px;
      height: 58px;
      margin: auto;
      border-radius: 16px;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.08);
    }

    h1 {
      font-size: 28px;
      margin: 18px 0 8px;
    }

    .subtitle {
      color: #6b7280;
      font-size: 15px;
      line-height: 1.5;
      margin: 0 auto;
      max-width: 420px;
    }

    .card {
      width: calc(100% - 30px);
      max-width: 500px;
      margin: 10px auto 40px;
      background: #fff;
      border-radius: 20px;
      padding: 25px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
    }

    label {
      display: block;
      text-align: left;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      padding: 14px 15px;
      border: 1px solid #dadce0;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
      margin-bottom: 15px;
    }

    input:focus {
      border-color: #4285f4;
      box-shadow: 0 0 0 3px rgba(66,133,244,0.12);
    }

    .generate-btn {
      width: 100%;
      padding: 15px;
      border: 0;
      border-radius: 10px;
      background: #4285f4;
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }

    .generate-btn:hover {
      opacity: 0.92;
    }

    .qr-section {
      display: none;
      text-align: center;
      margin-top: 28px;
      padding-top: 25px;
      border-top: 1px solid #eee;
    }

    .qr-section h2 {
      font-size: 19px;
      margin: 0 0 5px;
    }

    .qr-info {
      color: #6b7280;
      font-size: 13px;
      margin-bottom: 20px;
    }

    .qr-wrapper {
      display: inline-block;
      padding: 18px;
      background: #fff;
      border-radius: 15px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.08);
    }

    #qrcode canvas {
      display: block;
    }

    .download-btn {
      width: 100%;
      margin-top: 18px;
      padding: 14px;
      border: 1px solid #dadce0;
      border-radius: 10px;
      background: #fff;
      color: #202124;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }

    .download-btn:hover {
      background: #f8f9fa;
    }

    .error {
      color: #d93025;
      font-size: 13px;
      margin-top: 10px;
      text-align: left;
    }

    .tip {
      margin-top: 20px;
      padding: 12px;
      background: #f8f9fa;
      border-radius: 10px;
      color: #5f6368;
      font-size: 12px;
      line-height: 1.5;
    }

    .back-link {
      display: block;
      text-align: center;
      margin-top: 22px;
      color: #4285f4;
      text-decoration: none;
      font-size: 14px;
    }

    @media (max-width: 600px) {
      .header {
        padding-top: 30px;
      }

      h1 {
        font-size: 24px;
      }

      .card {
        padding: 20px;
      }
    }
  </style></head><body>  <div class="header"><div class="logo">
  ⭐
</div>

<h1>Google Review QR Code</h1>

<p class="subtitle">
  Create a QR code that makes it easy for your customers
  to leave a Google review.
</p>

  </div>  <div class="card"><label for="businessName">
  Business Name
</label>

<input
  type="text"
  id="businessName"
  placeholder="Example: Shree Shivshakti Enterprises"
>


<label for="reviewUrl">
  Google Review Link
</label>

<input
  type="url"
  id="reviewUrl"
  placeholder="Paste your Google Review link"
  autocomplete="off"
>


<button
  class="generate-btn"
  id="generateBtn"
  type="button"
>
  ✨ Generate Review QR
</button>


<div id="error" class="error"></div>


<div class="qr-section" id="qrSection">

  <h2 id="businessTitle">
    Google Review
  </h2>

  <p class="qr-info">
    Scan to leave a Google review
  </p>

  <div class="qr-wrapper">
    <div id="qrcode"></div>
  </div>

  <button
    class="download-btn"
    id="downloadBtn"
    type="button"
  >
    ⬇️ Download QR Code
  </button>

  <div class="tip">
    💡 Print this QR code and place it at your counter,
    billing desk, table or packaging.
  </div>

</div>


<a href="index.html" class="back-link">
  ← Back to Review Generator
</a>

  </div>  <!-- QR Code Library -->  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>  <script>

    const businessName =
      document.getElementById("businessName");

    const reviewUrl =
      document.getElementById("reviewUrl");

    const generateBtn =
      document.getElementById("generateBtn");

    const qrSection =
      document.getElementById("qrSection");

    const qrCode =
      document.getElementById("qrcode");

    const downloadBtn =
      document.getElementById("downloadBtn");

    const businessTitle =
      document.getElementById("businessTitle");

    const error =
      document.getElementById("error");


    generateBtn.addEventListener("click", function () {

      const name = businessName.value.trim();
      const url = reviewUrl.value.trim();

      error.textContent = "";


      if (!name) {
        error.textContent =
          "Please enter your business name.";
        return;
      }


      if (!url) {
        error.textContent =
          "Please paste your Google Review link.";
        return;
      }


      try {
        new URL(url);
      } catch {
        error.textContent =
          "Please enter a valid Google Review link.";
        return;
      }


      // Remove previous QR
      qrCode.innerHTML = "";


      // Business name
      businessTitle.textContent =
        name;


      // Generate QR
      new QRCode(qrCode, {
        text: url,
        width: 250,
        height: 250,
        correctLevel: QRCode.CorrectLevel.H
      });


      qrSection.style.display = "block";


      // Scroll to QR
      qrSection.scrollIntoView({
        behavior: "smooth",
        block: "center"
      });

    });


    downloadBtn.addEventListener("click", function () {

      const canvas =
        qrCode.querySelector("canvas");

      if (!canvas) {
        return;
      }


      const link =
        document.createElement("a");

      link.download =
        "google-review-qr.png";

      link.href =
        canvas.toDataURL("image/png");


      document.body.appendChild(link);

      link.click();

      document.body.removeChild(link);

    });


    reviewUrl.addEventListener("keydown", function(event) {

      if (event.key === "Enter") {
        generateBtn.click();
      }

    });

  </script></body>
</html>
