<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Review Generator</title>

    <meta
        name="description"
        content="Generate a natural Google review in seconds."
    >

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

    <!-- HEADER -->

    <header class="header">

        <div class="logo">★</div>

        <h1>Shree Shivshakti Enterprises</h1>

        <p>
            Share your experience with us
        </p>

    </header>


    <!-- MAIN -->

    <main class="card">

        <!-- PRODUCT -->

        <div class="section">

            <label>
                Select Product
            </label>

            <select id="product">

                <option value="">
                    Select a product
                </option>

                <option value="Nilkamal Chair">
                    Nilkamal Chair
                </option>

                <option value="Nilkamal Table">
                    Nilkamal Table
                </option>

                <option value="Nilkamal Cupboard">
                    Nilkamal Cupboard
                </option>

                <option value="Nilkamal Furniture">
                    Other Nilkamal Furniture
                </option>

            </select>

        </div>


        <!-- REVIEW -->

        <div class="section">

            <label>
                Your Review
            </label>

            <textarea
                id="review"
                placeholder="Your review will be written automatically..."
            ></textarea>

        </div>


        <!-- BUTTONS -->

        <div class="buttons">

            <button
                id="rewriteBtn"
                class="rewrite-btn"
                type="button"
            >
                ✨ Rewrite
            </button>


            <button
                id="submitBtn"
                class="submit-btn"
                type="button"
            >
                ⭐ Submit Review
            </button>

        </div>


        <!-- MESSAGE -->

        <div
            id="message"
            class="message"
        ></div>


        <p class="notice">

            Please check the review and make sure it
            accurately reflects your genuine experience
            before submitting.

        </p>

    </main>


    <footer>

        AI Review Generator

    </footer>

</div>


<script src="script.js"></script>

</body>
</html>
