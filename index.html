<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <link
        rel="icon"
        type="image/png"
        href="https://www.google.com/s2/favicons?domain=google.com&sz=64"
    >

    <title>Google Trust Review</title>

    <meta
        name="description"
        content="Generate natural customer reviews in seconds."
    >

    <link rel="stylesheet" href="style.css">

</head>


<body>

<div class="app">


    <!-- HEADER -->

    <header class="header">

        <div class="logo">

            <img
                src="https://raw.githubusercontent.com/Nilkamalchairs/ai-review-qr/refs/heads/main/Google-Review-Logo.png"
                alt="Google"
            >

        </div>


        <h1>
            Nilkamal - SHREE SHIVSHAKTI ENTERPRISES
        </h1>


        <p>
            Share your experience with us
        </p>

    </header>



    <!-- MAIN -->

    <main class="card">


        <!-- PRODUCT -->

        <div class="section">

            <label for="product">
                Select Product
            </label>


            <select id="product">

                <option value="">
                    Select a product
                </option>

                <option value="Nilkamal Chair">
                    Nilkamal Chair
                </option>

                <option value="Nilkamal Cabinet">
                    Nilkamal Cabinet
                </option>

                <option value="Nilkamal Product">
                    Nilkamal Product
                </option>

                <option value="Nilkamal Shoe Rack">
                    Nilkamal Shoe Rack
                </option>

                <option value="Steel Sofacumbed">
                    Steel Sofacumbed
                </option>

                <option value="Steel Cupboard">
                    Steel Cupboard
                </option>

                <option value="Washing Machine Stand">
                    Washing Machine Stand
                </option>

                <option value="Wooden Mandir">
                    Wooden Mandir
                </option>

                <option value="Plastic Heavy Quality Table">
                    Plastic Heavy Quality Table
                </option>

                <option value="Wooden Folding Table">
                    Wooden Folding Table
                </option>

                <option value="Plastic Folding Table">
                    Plastic Folding Table
                </option>

                <option value="Study Table">
                    Study Table
                </option>

            </select>

        </div>



        <!-- MESSAGE -->

        <div
            id="message"
            class="message"
            aria-live="polite"
        ></div>



        <!-- REVIEW CARDS -->

        <div
            id="reviewsContainer"
            class="reviews-container"
        ></div>



        <!-- NOTICE -->

        <p class="notice">

            Please check each review and make sure it accurately
            reflects your genuine experience before submitting.

        </p>

    </main>



    <!-- FOOTER -->

    <footer>

        Google Review - © 2026

    </footer>


</div>


<script src="script.js"></script>

</body>

</html>
